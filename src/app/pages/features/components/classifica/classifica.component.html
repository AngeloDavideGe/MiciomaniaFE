<app-container-micio>
  <app-descrizione-micio
    [titolo]="'Classifica'"
    [descrizione]="
      'Osserva la classifica dei giocatori e delle squadre più deridenti della Miciomania Season'
    "
    [immagine]="'https://images.unsplash.com/photo-1515879218367-8466d910aaa4'"
  >
    <div all-row>
      <div class="elemento-centrato p-2">
        <app-tabs-indy [tabs]="tabs" (clickTab)="currentTab.set($event)" />
      </div>

      <br />

      @if (spinner()) {
        <app-spinner-indy [mt]="'5rem'"></app-spinner-indy>
      } @else {
        @switch (currentTab()) {
          @case ("giocatori") {
            <app-table-indy
              [elemTable]="giocatori()"
              [titoloTabella]="'Giocatori'"
              [colonne]="colonneGiocatori"
              [recordBadge]="badgeTable"
            >
            </app-table-indy>
          }
          @case ("squadre") {
            <app-table-indy
              [elemTable]="squadre()"
              [titoloTabella]="'Squadre'"
              [colonne]="colonneSquadre"
              [keyPrimary]="'nome'"
              [templateCustom]="customTemplate"
              [recordBadge]="badgeTable"
            >
              <ng-template #customTemplate let-elem>
                <div class="dettagli-squadra">
                  <div class="squadra-descrizione">
                    <p>{{ elem.descrizione }}</p>
                  </div>
                </div>
              </ng-template>
            </app-table-indy>
          }
        }
      }
    </div>
  </app-descrizione-micio>
</app-container-micio>
