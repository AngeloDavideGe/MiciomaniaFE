<section class="edit-user-panel">
  <div class="edit-user-intro">
    <div class="intro-icon"><i class="bi bi-person-gear"></i></div>
    <div>
      <span class="eyebrow">Impostazioni account</span>
      <h2>I tuoi dati</h2>
      <p>Gestisci le informazioni con cui ti presenti nella community.</p>
    </div>
  </div>

  <div class="form-shell">
    <app-multi-form
      [strutturaForm]="formEditUser()"
      (invioDati)="updateUser($event)"
      (secondaryButton)="chiudi.emit()"
    ></app-multi-form>
  </div>
</section>
