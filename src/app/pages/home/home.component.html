@if (isHome$ | async) {
  <app-navbar-indy>
    <div rightContent>
      <div class="elementi-laterali gap-3">
        <app-toggle-indy
          [icona]="'bi bi-bell'"
          [titolo]="'Notifiche'"
          [tipo]="'single'"
          [toggleMenus]="notificheToggle()"
          [toggleStyles]="{ width: '20rem', height: '30rem' }"
          [(menuOpen)]="menuOpen"
        />
        <app-toggle-indy
          [icona]="'bi bi-gear'"
          [titolo]="'Impostazioni'"
          [toggleMenus]="impostazioniToggle()"
          [toggleStyles]="{ width: '20rem' }"
          [(menuOpen)]="menuOpen"
        />
        <app-toggle-indy
          [titolo]="'Account utente'"
          [imgIcona]="imgToggle()"
          [tipo]="'single'"
          [toggleMenus]="accountToggle()"
          [toggleStyles]="{ width: '20rem', right: '1rem' }"
          [(menuOpen)]="menuOpen"
        >
          <div downContent class="account-actions">
            <div class="account-divider"></div>

            @if (authService.accountsUser().length < maxUsers) {
              <button type="button" (click)="router.navigate(['auth/login'])">
                <span class="account-action-icon">
                  <i class="bi bi-plus-lg"></i>
                </span>
                <span>Aggiungi un altro account</span>
              </button>
            }

            @if (authService.currentUser()) {
              <button
                type="button"
                class="logout-all"
                (click)="logoutAllAccounts()"
              >
                Esci da tutti gli account
              </button>
            }
          </div>
        </app-toggle-indy>
      </div>
    </div>
  </app-navbar-indy>

  <section style="margin-top: 4rem">
    <app-container-micio>
      <app-descrizione-micio
        [titolo]="'Benvenuto su Miciomania'"
        [descrizione]="
          'Il posto perfetto per leggere manga, ascoltare musica parodia, giocare con i sentimenti e far piangere Sirius.'
        "
        [immagine]="
          'https://images.unsplash.com/photo-1515879218367-8466d910aaa4'
        "
      />
    </app-container-micio>
  </section>

  <section class="card-section">
    <app-card-indy
      [elems]="cardsHome"
      [titoloLista]="'✨​ Cosa vuoi fare oggi?'"
      [tipoSlice]="'single'"
      [altezzaImg]="'13rem'"
      [cardPosition]="'start'"
      [arrayPags]="arrayRaggi"
    />
  </section>

  <app-social-link></app-social-link>
  <!-- <app-footer></app-footer> -->
}

<router-outlet></router-outlet>
